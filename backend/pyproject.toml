[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-nexus-ai-backend"
version = "0.1.0"
description = "Doc Nexus AI modular monolith backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "PyJWT>=2.13,<3",
  "cryptography>=50,<51",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlite-vec>=0.1.6,<1",
  "alembic>=1.14,<2",
  "argon2-cffi>=23,<26",
  "email-validator>=2.2,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "minio>=7.2,<8",
  "networkx>=3.3,<4",
  "xlrd>=2.0.1,<3",
  "python-pptx>=0.6.21,<1",
  "pypdf>=6.15,<7",
  "pypdfium2>=5.13,<6",
  "Pillow>=12.3,<13",
  "pillow-heif==1.8.1",
  "defusedxml>=0.7,<1",
  "reportlab>=4.0,<5",
  "pyyaml>=6,<7",
  "olefile>=0.47,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
  "builtin_skills/minio-upload/SKILL.md",
  "builtin_skills/minio-upload/minio_upload.py",
  "builtin_skills/open-meteo-api/SKILL.md",
  "builtin_skills/open-meteo-api/scripts/*.py",
  "builtin_skills/open-meteo-api/references/*.md",
  "builtin_skills/pptx/*",
  "builtin_skills/pptx/scripts/*",
  "builtin_skills/dashi-ppt/*",
  "builtin_skills/dashi-ppt/**/*",
  "builtin_skills/dashi-ppt/.*",
  "builtin_skills/dashi-ppt/project/.*",
]
