server:
  port: 8080

spring:
  application:
    name: light-mes-backend
  datasource:
    url: jdbc:mysql://localhost:3308/light_mes?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: "${SPRING_DATASOURCE_PASSWORD:CHANGE_ME}" # 本地/生产环境均通过环境变量注入
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

mes:
  jwt:
    # 必须通过环境变量 MES_JWT_SECRET 注入至少 32 字节随机串（openssl rand -hex 32）。
    # 历史密钥曾提交进仓库且已公开，禁止复用；未配置或强度不足时应用拒绝启动（见 JwtUtil）。
    secret: "${MES_JWT_SECRET:}"
    expire-hours: 24
