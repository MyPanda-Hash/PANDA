server:
  port: 8080

spring:
  application:
    name: light-mes-backend
  datasource:
    url: jdbc:mysql://localhost:3306/light_mes?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: "CHANGE_ME" # 生产环境通过环境变量 SPRING_DATASOURCE_PASSWORD 注入
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

mes:
  jwt:
    # 生产环境必须通过环境变量 MES_JWT_SECRET 注入随机值（历史版本曾提交真实密钥且已公开，须轮换）
    secret: "CHANGE_ME_RANDOM_HEX_64"
    expire-hours: 24
  panelx:
    base-url: https://demo.kwaidoo.com/VF_DEV/
    bus-domain-code: SdkTest
    app-code: SdkTest
    username: CHANGE_ME
    password: "CHANGE_ME"
    panel-map:
      MANU_ORDER: SdkTest_IML_00002
