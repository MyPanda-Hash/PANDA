server:
  # U 盘多机环境：端口随机器变化，统一走环境变量（默认回归提交约定 8080）
  port: "${MES_HTTP_PORT:8080}"

spring:
  application:
    name: light-mes-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 10MB
  datasource:
    # 主机/端口环境变量化（默认回归提交约定 localhost:3308），多机 U 盘环境不再改文件
    url: jdbc:mysql://${MES_DB_HOST:localhost}:${MES_DB_PORT:3308}/light_mes?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: "${SPRING_DATASOURCE_PASSWORD:CHANGE_ME}" # 本地/生产环境均通过环境变量注入
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

mes:
  jwt:
    # 生产环境必须通过环境变量 MES_JWT_SECRET 注入随机值（历史版本曾提交真实密钥且已公开，须轮换）
    secret: "CHANGE_ME_RANDOM_HEX_64"
    expire-hours: 24
  ocr:
    access-key-id: "${ALIBABA_CLOUD_ACCESS_KEY_ID:}"
    access-key-secret: "${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}"
    endpoint: "${ALIBABA_CLOUD_OCR_ENDPOINT:ocr-api.cn-hangzhou.aliyuncs.com}"
    connect-timeout-ms: "${ALIBABA_CLOUD_OCR_CONNECT_TIMEOUT_MS:5000}"
    read-timeout-ms: "${ALIBABA_CLOUD_OCR_READ_TIMEOUT_MS:35000}"
    requests-per-minute: "${ALIBABA_CLOUD_OCR_REQUESTS_PER_MINUTE:10}"
    max-concurrent: "${ALIBABA_CLOUD_OCR_MAX_CONCURRENT:4}"
  # 2026-09-01 阶段 A：机器翻译（默认与 OCR 共用一套阿里云凭证；未配置凭证时接口回退中文原文）
  mt:
    access-key-id: "${ALIBABA_CLOUD_ACCESS_KEY_ID:}"
    access-key-secret: "${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}"
    endpoint: "${ALIBABA_CLOUD_MT_ENDPOINT:mt.cn-hangzhou.aliyuncs.com}"
    connect-timeout-ms: "${ALIBABA_CLOUD_MT_CONNECT_TIMEOUT_MS:5000}"
    read-timeout-ms: "${ALIBABA_CLOUD_MT_READ_TIMEOUT_MS:10000}"
    cache-ttl-seconds: 30
    max-keys-per-request: 50
