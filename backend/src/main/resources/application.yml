server:
  port: 8080

spring:
  application:
    name: light-mes-backend
  datasource:
    url: jdbc:mysql://localhost:3308/light_mes?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: "${SPRING_DATASOURCE_PASSWORD:CHANGE_ME}" # 本地/生产环境均通过环境变量注入
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

mes:
  jwt:
    # 生产环境必须通过环境变量 MES_JWT_SECRET 注入随机值（历史版本曾提交真实密钥且已公开，须轮换）
    secret: "CHANGE_ME_RANDOM_HEX_64"
    expire-hours: 24
