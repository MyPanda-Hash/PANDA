# ============================================================
# light-mes 正式部署 nginx 站点配置（PanelX 直连模式）
# 用法：
#   1) npm run build 后把 light-mes/frontend/dist 上传到服务器 /var/www/light-mes/dist
#   2) 本文件按需改 server_name / 证书路径 后放入
#      /etc/nginx/conf.d/mes.example.com.conf  （或 sites-available 软链）
#   3) nginx -t && systemctl reload nginx
# 架构：
#   浏览器 -> nginx
#     /            -> 静态前端（light-mes dist）
#     /wp-core/*   -> http://203.132.49.57:6612/hscx/wp-core/* （PanelX 平台，同源）
#     /wp-file/*   -> http://203.132.49.57:6612/hscx/wp-file/*  （文件服务）
# ============================================================

# ---- 80 -> 443 跳转 ----
server {
    listen 80;
    server_name mes.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mes.example.com;

    ssl_certificate     /etc/letsencrypt/live/mes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mes.example.com/privkey.pem;

    root /var/www/light-mes/dist;
    index index.html;

    # 上传大小（面板附件等）
    client_max_body_size 200m;

    # ---- SPA 路由回退（页面刷新不 404） ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 静态资源缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- PanelX 平台反代（关键：SDK 与数据接口同源，preload 探测可命中） ----
    location /wp-core/ {
        proxy_pass http://203.132.49.57:6612/hscx/wp-core/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        # SSE 流式（callButtonStream / callEventStream）需要关闭缓冲
        proxy_buffering off;
        proxy_cache off;
    }

    # ---- 文件服务反代 ----
    location /wp-file/ {
        proxy_pass http://203.132.49.57:6612/hscx/wp-file/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # ---- 可选：安全头 ----
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
