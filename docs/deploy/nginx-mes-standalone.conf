# ============================================================
# light-mes 完全自建部署 nginx 站点配置（路线①：无 SDK、无外部平台）
# 架构：
#   浏览器 -> nginx
#     /          -> 前端静态文件（light-mes/frontend/dist）
#     /api/*     -> 本机 Spring Boot 后端 (127.0.0.1:8080)
# 用法见 docs/deploy/部署说明.md（路线①）
# ============================================================

# ---- 80 -> 443 跳转 ----
server {
    listen 80;
    server_name mes.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mes.example.com;

    ssl_certificate     /etc/letsencrypt/live/mes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mes.example.com/privkey.pem;

    root /var/www/light-mes/dist;
    index index.html;

    # 上传大小
    client_max_body_size 200m;

    # ---- SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 静态资源缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 后端 API 反代（本机 Spring Boot :8080） ----
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
