name: deploy-backend

# 触发：
#   - push 到 master 且改动 backend/ -> 自动构建并部署
#   - 手动触发：默认部署，可取消勾选只验证构建
on:
  push:
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: '部署到服务器'
        type: boolean
        default: true

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build jar
        working-directory: backend
        run: mvn -B clean package -DskipTests

      - name: Resolve jar
        id: jar
        run: |
          JAR=$(ls backend/target/*.jar | grep -v '\.original$' | head -n 1)
          test -n "$JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "artifact=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        if: github.event_name == 'push' || inputs.deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          VERSION="${GITHUB_SHA:0:7}"
          JAR="${{ steps.jar.outputs.path }}"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes "$JAR" "$SSH_USER@$SSH_HOST:/tmp/light-mes-$VERSION.jar"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "sudo -n /opt/light-mes/bin/deploy.sh /tmp/light-mes-$VERSION.jar $VERSION"

      - name: Summary
        if: always()
        run: echo "artifact=${{ steps.jar.outputs.artifact }} sha=${GITHUB_SHA:0:7} status=${{ job.status }}"
